# learn-medicat F6 Start Here prototype
# PROTOTYPE ONLY — DO NOT DEPLOY TO THE BOOTABLE TARGET.
# Exact image paths and boot commands are intentionally absent until the
# installed X10 build has been inventoried and boot-tested.

submenu 'START HERE — Choose the job, then use the full Guide Center -->' --class=customsub {
    menuentry 'Windows will not boot' --class=custom {
        echo 'First identify the failed layer: hardware, firmware, disk detection,'
        echo 'boot mode, partition layout, boot files, or Windows itself.'
        echo 'Do not convert GPT/MBR or rewrite boot records by guesswork.'
        echo
        echo 'Open Mini Windows -> MediCat Field Guide -> Windows will not boot.'
        echo
        read 'Press Enter to return...'
    }

    menuentry 'I cannot sign in to Windows' --class=custom {
        echo 'Identify local account, Microsoft account, PIN, BitLocker/EFS,'
        echo 'firmware password, or organization-managed access before a reset.'
        echo
        echo "Open the Field Guide before launching Jayro's Lockpick."
        echo
        read 'Press Enter to return...'
    }

    menuentry 'I need files before repair' --class=custom {
        echo 'Decide what must survive and verify what is actually recoverable'
        echo 'from cloud or another device. A full disk image is not always needed.'
        echo
        echo 'Open the Field Guide -> Do I even need a backup?'
        echo
        read 'Press Enter to return...'
    }

    menuentry 'I want to install or reinstall Windows' --class=custom {
        echo 'Confirm the physical target, accepted erase scope, backup, passkeys,'
        echo '2FA, recovery codes, password vault, and encryption keys first.'
        echo
        echo 'Open the Field Guide -> Install Windows cleanly.'
        echo
        read 'Press Enter to return...'
    }

    menuentry 'I need a live operating system or recovery environment' --class=custom {
        echo 'Choose by job: Mini Windows, Linux rescue, installer, or dedicated tool.'
        echo 'Running from USB does not make every action read-only.'
        echo
        echo 'Open the Field Guide -> Which environment should I boot?'
        echo
        read 'Press Enter to return...'
    }

    menuentry 'I am preparing to wipe, flash, reset, or reimage' --class=custom {
        echo 'Check passkeys, authenticator codes, push approvals, password managers,'
        echo 'recovery codes, and disk/device recovery keys before erasing the holder.'
        echo
        echo 'Open the Field Guide -> Prepare to wipe, flash, or reset.'
        echo
        read 'Press Enter to return...'
    }

    menuentry '<-- Return to Ventoy [Esc]' --class=vtoyret VTOY_RET {
        echo 'Return to Ventoy...'
    }
}

menuentry '<-- Return to Ventoy [Esc]' --class=vtoyret VTOY_RET {
    echo 'Return to Ventoy...'
}
